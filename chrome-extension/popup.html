<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield</title>
    <style>
        :root {
            --c-paper: #EFEEE9;
            --c-ink: #111111;
            --c-acid: #D4DE3A;
            --c-acid-glass: rgba(212, 222, 58, 0.65);
            --c-text-dim: #555555;
            --f-display: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --f-mono: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            background: var(--c-paper);
            font-family: var(--f-display);
            color: var(--c-ink);
            overflow: hidden;
        }

        /* Header */
        .popup-header {
            padding: 20px 20px 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--c-ink);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 16px;
            height: 16px;
            background: var(--c-ink);
            border-radius: 50%;
            position: relative;
        }
        .brand-icon::before,
        .brand-icon::after {
            content: '';
            position: absolute;
            background: var(--c-acid);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .brand-icon::before { width: 2px; height: 10px; }
        .brand-icon::after { width: 10px; height: 2px; }

        .brand-name {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .version-tag {
            font-family: var(--f-mono);
            font-size: 9px;
            color: var(--c-text-dim);
            text-align: right;
            line-height: 1.5;
        }

        /* Status Section */
        .status-section {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(17,17,17,0.15);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            font-family: var(--f-mono);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--c-text-dim);
            font-weight: 700;
        }

        .status-value {
            font-family: var(--f-mono);
            font-size: 11px;
            font-weight: 700;
        }

        .status-pill {
            background: var(--c-acid-glass);
            border: 2px solid var(--c-ink);
            padding: 3px 12px;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--f-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 2px 2px 0px var(--c-ink);
        }

        .status-pill.online  { 
            color: var(--c-ink);
            background: var(--c-acid);
        }
        .status-pill.offline { 
            color: #fff;
            background: #d32f2f;
            border-color: #d32f2f;
            box-shadow: 2px 2px 0px #8b0000;
        }

        /* Action Footer */
        .popup-footer {
            background: var(--c-ink);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 2px solid var(--c-ink);
        }

        .footer-btn {
            background: var(--c-acid);
            color: var(--c-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: transform 0.15s, box-shadow 0.15s;
            padding: 10px 18px;
            font-family: var(--f-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--c-acid);
            box-shadow: 2px 2px 0px rgba(212,222,58,0.3);
        }

        .footer-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0;
        }

        .footer-text {
            font-family: var(--f-mono);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--c-acid);
            opacity: 0.5;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="popup-header">
        <div class="brand">
            <div class="brand-icon"></div>
            <span class="brand-name">CyberShield</span>
        </div>
        <div class="version-tag">V1.0.0<br>SAFE COMPOSE</div>
    </div>

    <!-- Status -->
    <div class="status-section">
        <div class="status-row">
            <span class="status-label">Server</span>
            <span class="status-pill" id="serverPill">CHECKING</span>
        </div>
        <div class="status-row">
            <span class="status-label">Platform</span>
            <span class="status-value">TWITTER / X</span>
        </div>
        <div class="status-row">
            <span class="status-label">Endpoint</span>
            <span class="status-value">LOCALHOST:5000</span>
        </div>
        <div class="status-row">
            <span class="status-label">Protection</span>
            <span class="status-value">REAL-TIME</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
        <a class="footer-btn" href="http://localhost:5000" target="_blank">
            Open Dashboard →
        </a>
        <div class="footer-text">View full<br>analytics</div>
    </div>

    <script>
        fetch('http://localhost:5000/')
            .then(() => {
                const pill = document.getElementById('serverPill');
                pill.textContent = 'CONNECTED';
                pill.className = 'status-pill online';
            })
            .catch(() => {
                const pill = document.getElementById('serverPill');
                pill.textContent = 'OFFLINE';
                pill.className = 'status-pill offline';
            });
    </script>
</body>
</html>
